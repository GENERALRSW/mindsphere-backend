[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "tr -d '\r' < requirements.txt | sed -e '1 s/^\\xEF\\xBB\\xBF//' -e '/^```*$/d' -e '/^\\s*$/d' > requirements.clean.txt",
  "pip install --upgrade pip setuptools wheel",
  "pip install -r requirements.clean.txt"
]

[start]
cmd = "bash -lc 'cd railway_api && uvicorn main:app --host 0.0.0.0 --port $PORT'"
